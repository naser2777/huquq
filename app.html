<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحقوق المالية</title>
<meta name="theme-color" content="#0d4a3e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* التصميم: «دفتر حقوق» — أخضر عميق كحبر الدفاتر مع ذهبي الميزان من الأيقونة،
   خط نسخي حديث للنص وكوفي للعناوين والأرقام، وبطاقات بيضاء هادئة على ورق دافئ */
:root{
  --bg:#f2f4ef; --card:#ffffff; --ink:#18241f; --ink2:#3d4c46; --muted:#6c7b74; --line:#e2e7e1;
  --brand:#0d4a3e; --brand2:#13705c; --brand-ink:#0d5a4a; --gold:#c99a3a; --gold-soft:#f6ecd6;
  --tint:#e4efe9; --soft:#eef2ed; --soft2:#f6f8f4; --input:#fbfcfa; --track:#e3e9e4;
  --green:#137a44; --green-bg:#e4f4ea; --red:#b9282f; --red-bg:#fbe9e9; --amber:#a35d08; --amber-bg:#fdf1dc;
  --blue:#2b5797; --blue-bg:#e8eef7; --toast-bg:#18241f; --toast-ink:#ffffff;
  --on-brand:#ffffff; --hero1:#0d4a3e; --hero2:#0a3a31;
  --shadow:0 1px 2px rgba(16,40,32,.05),0 4px 14px rgba(16,40,32,.06);
  --shadow-lg:0 10px 30px rgba(13,74,62,.28);
  --f-text:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1412; --card:#151f1c; --ink:#e7eeeb; --ink2:#bccac4; --muted:#8fa09a; --line:#24322d;
  --brand:#13705c; --brand2:#1b8a72; --brand-ink:#6fd8bd; --gold:#e2b75a; --gold-soft:#3a3020;
  --tint:#1a2f29; --soft:#1d2925; --soft2:#18231f; --input:#111a17; --track:#24322d;
  --green:#5ad08d; --green-bg:#16301f; --red:#f2787d; --red-bg:#3a1a1c; --amber:#f3b74f; --amber-bg:#372a12;
  --blue:#93b6ec; --blue-bg:#1b2840; --toast-bg:#e7eeeb; --toast-ink:#0c1412;
  --hero1:#11463b; --hero2:#0b2e27;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1412; --card:#151f1c; --ink:#e7eeeb; --ink2:#bccac4; --muted:#8fa09a; --line:#24322d;
  --brand:#13705c; --brand2:#1b8a72; --brand-ink:#6fd8bd; --gold:#e2b75a; --gold-soft:#3a3020;
  --tint:#1a2f29; --soft:#1d2925; --soft2:#18231f; --input:#111a17; --track:#24322d;
  --green:#5ad08d; --green-bg:#16301f; --red:#f2787d; --red-bg:#3a1a1c; --amber:#f3b74f; --amber-bg:#372a12;
  --blue:#93b6ec; --blue-bg:#1b2840; --toast-bg:#e7eeeb; --toast-ink:#0c1412;
  --hero1:#11463b; --hero2:#0b2e27;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:100px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
b,.val,.amt,.nums b,.bal{font-variant-numeric:tabular-nums}

/* الشريط العلوي */
header{background:var(--brand);color:var(--on-brand);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header .row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
header h1{font-family:var(--f-head);font-size:19px;font-weight:700;flex:1;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);color:var(--on-brand);font-size:19px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:rgba(255,255,255,.24)}

main{max-width:640px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* الملخص: بطاقة الصافي البارزة ثم لي وعلي */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum .box{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.sum .box:nth-child(1){border-top:3px solid var(--green)}
.sum .box:nth-child(2){border-top:3px solid var(--red)}
.sum .lbl{font-size:13px;color:var(--muted);font-weight:500}
.sum .val{font-family:var(--f-head);font-size:19px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .net{grid-column:1/-1;order:-1;display:flex;flex-direction:column;gap:4px;padding:18px 18px 20px;
  background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--on-brand);box-shadow:var(--shadow-lg);border-top:0;position:relative;overflow:hidden}
.sum .net::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.05)}
.sum .net .lbl{color:rgba(255,255,255,.75);font-size:14px}
.sum .net .val{font-size:28px;color:var(--gold)!important}
.g{color:var(--green)} .r{color:var(--red)}

.alert{display:flex;align-items:center;gap:8px;background:var(--red-bg);color:var(--red);border-radius:var(--r-sm);padding:11px 14px;margin-bottom:14px;font-weight:600;font-size:14px}

.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);margin-bottom:10px;box-shadow:var(--shadow)}
.search:focus{outline:none;border-color:var(--brand2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* قائمة الأشخاص */
.person{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:var(--r);padding:13px 14px;margin-bottom:8px;width:100%;text-align:right;box-shadow:var(--shadow)}
.person:active,.uprow:active{transform:scale(.99)}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:18px;flex:none}
.person .info{flex:1;min-width:0}
.person .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .meta{font-size:13px;color:var(--muted);margin-top:2px}
.person .bal{text-align:left;font-family:var(--f-head);font-weight:700;font-size:15px;white-space:nowrap}
.person .bal small{display:block;font-family:var(--f-text);font-weight:500;font-size:12px;color:var(--muted)}
.tag-late{color:var(--red);font-weight:600}

.empty{text-align:center;color:var(--muted);padding:44px 16px;line-height:2;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}

/* صفحة الشخص */
.phead{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.phead .top{display:flex;align-items:center;gap:12px}
.phead h2{font-family:var(--f-head);font-size:19px}
.phead .net{margin-top:14px;padding:12px;border-radius:var(--r-sm);font-family:var(--f-head);font-weight:700;text-align:center;font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:13px 12px;border-radius:var(--r-sm);font-weight:700;text-align:center;display:block;width:100%;text-decoration:none;font-size:15px}
.btn:active{filter:brightness(.95)}
.btn:disabled{opacity:.6}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.sec{background:var(--tint);color:var(--brand-ink)}
.btn.wa{background:#1d9e52;color:#ffffff}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.full{grid-column:1/-1}
.smallbtn{padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600;background:var(--soft);color:var(--ink2)}
.smallbtn.pri{background:var(--brand);color:var(--on-brand)}
.smallbtn.danger{color:var(--red);background:var(--red-bg)}

/* بطاقة الحق */
.entry{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.entry.done{opacity:.72}
.entry .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.badge.li{background:var(--green-bg);color:var(--green)}
.badge.alay{background:var(--red-bg);color:var(--red)}
.badge.late{background:var(--red);color:var(--card)}
.badge.ok{background:var(--blue-bg);color:var(--blue)}
.entry .reason{font-family:var(--f-head);font-weight:700;font-size:16px;flex:1;min-width:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 10px;text-align:center;background:var(--soft2);border-radius:var(--r-sm);padding:10px 0}
.nums div{padding:0 4px;min-width:0}
.nums div+div{border-right:1px solid var(--line)}
.nums small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.nums b{font-family:var(--f-head);font-size:15px;white-space:nowrap}
.bar{height:6px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--gold));border-radius:4px}
.dates{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.8}
.dates b{color:var(--ink)}
.dates .late{color:var(--red);font-weight:700}
.notes{font-size:13px;margin-top:8px;color:var(--ink2);white-space:pre-wrap;background:var(--gold-soft);border-radius:10px;padding:8px 10px}
.pays{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.pays .p{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.pays .p span{flex:1}
.pays .x,.items .it .x{color:var(--red);font-size:13px;padding:4px 8px;border-radius:8px}
.ebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

/* القادم */
.up{background:var(--card);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.up h4{padding:13px 16px 8px;font-family:var(--f-head);font-size:15px;display:flex;align-items:center;gap:8px}
.up h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.uprow{display:flex;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:right}
.uprow .info{flex:1;min-width:0}
.uprow .name{font-weight:700;font-size:15px}
.uprow .meta{font-size:12px;color:var(--muted);margin-top:2px}
.uprow .amt{font-family:var(--f-head);font-weight:700;font-size:15px;text-align:left;white-space:nowrap}
.uprow .amt .meta{font-family:var(--f-text);font-weight:500}
.when{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.when.late{background:var(--red-bg);color:var(--red)}
.when.today{background:var(--amber-bg);color:var(--amber)}
.up .more{padding:9px 16px 13px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* مجاميع القوائم */
.listsum{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;background:var(--gold-soft);border-radius:var(--r-sm);padding:11px 14px;margin-bottom:10px;font-size:14px;color:var(--ink2)}
.listsum b{font-family:var(--f-head)}
.psplit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px;text-align:center}
.psplit div{background:var(--soft2);border-radius:10px;padding:8px;color:var(--muted)}
.psplit b{font-family:var(--f-head);font-size:15px}

/* الأقساط والإضافات */
.inst{margin-top:10px}
.inst summary,.items summary{cursor:pointer;list-style:none}
.inst summary::-webkit-details-marker,.items summary::-webkit-details-marker{display:none}
.inst summary{font-size:14px;color:var(--brand-ink);font-weight:700;padding:6px 0}
.inst summary::after,.items summary span::after{content:" ▾";font-size:12px}
.inst[open] summary::after,.items[open] summary span::after{content:" ▴"}
.inst .row{display:flex;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.inst .row span:first-child{flex:1}
.items{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--soft2);padding:2px 12px}
.items summary{font-size:14px;font-weight:700;padding:9px 0;display:flex;justify-content:space-between;gap:8px;color:var(--brand-ink)}
.items summary b{font-family:var(--f-head);color:var(--ink)}
.items .it{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 0;border-top:1px dashed var(--line)}
.items .it span{flex:1;min-width:0}
.items .it .d{color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.items .it b{white-space:nowrap}
.breakdown{font-size:13px;color:var(--muted);margin:-2px 0 10px;text-align:center}

.sched{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
.sched .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sched h4{font-family:var(--f-head);font-size:16px;flex:1}
.sched .rule{font-family:var(--f-head);font-size:15px;color:var(--brand-ink);margin-bottom:8px}
.sched .line{font-size:14px;color:var(--ink2);line-height:1.9}
.sched .warn{font-size:13px;color:var(--amber);background:var(--amber-bg);border-radius:10px;padding:7px 10px;margin-top:8px}
.sched-cta{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;color:var(--ink)}
.sched-cta b{font-family:var(--f-head)}
.sched-cta span{flex:1;font-size:14px;line-height:1.7}
.sched-cta i{font-style:normal;font-size:22px;color:var(--gold)}
.crow{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.crow input{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--input);min-width:0}
.crow .x{color:var(--red);padding:8px;font-size:13px}
.toggle button.on.pl{border-color:var(--brand2);background:var(--tint);color:var(--brand-ink)}
.calbtns{display:grid;gap:8px;margin-top:14px}

/* Drive */
.drv{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin-bottom:10px;line-height:1.8}
.drv .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin-top:8px}
.drv .dot.on{background:var(--green)}
.drv .dot.err{background:var(--red)}
.bklist{display:grid;gap:6px;margin:10px 0}
.bklist button{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);text-align:right}
.sec-title{font-family:var(--f-head);font-size:14px;color:var(--muted);margin:18px 4px 10px;font-weight:700}

/* زر الإضافة العائم */
.fab{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--on-brand);border-radius:999px;padding:15px 22px;font-family:var(--f-head);font-weight:700;font-size:15px;box-shadow:var(--shadow-lg);z-index:6;border:2px solid var(--gold)}
.fab:active{transform:scale(.97)}

/* النوافذ */
.overlay{position:fixed;inset:0;background:rgba(6,20,16,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow-y:auto;animation:up .2s ease-out}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion: reduce){.overlay,.sheet{animation:none}}
.sheet h3{font-family:var(--f-head);font-size:18px;margin-bottom:14px}
.sheet .msg{line-height:1.9;white-space:pre-line}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--input)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--tint)}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{padding:12px 8px;border-radius:var(--r-sm);border:2px solid var(--line);font-weight:700;font-size:14px;background:var(--input)}
.toggle button.on.li{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.toggle button.on.alay{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--red);background:var(--red-bg);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.sheet .actions{margin-top:16px}

/* شاشة القفل */
#lock{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,var(--brand2),var(--hero1) 55%,var(--hero2));color:#ffffff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lock::before{content:"";width:64px;height:64px;border-radius:18px;margin-bottom:18px;background:rgba(255,255,255,.1) url("icon-192.png") center/cover;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#lock h2{font-family:var(--f-head);font-size:22px;margin-bottom:6px}
#lock p{opacity:.85;margin-bottom:24px;min-height:22px;text-align:center}
.dots{display:flex;gap:18px;margin-bottom:32px;direction:ltr}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85);transition:background .12s}
.dots span.f{background:var(--gold);border-color:var(--gold)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px;direction:ltr}
.pad button{height:74px;border-radius:50%;background:rgba(255,255,255,.1);color:#ffffff;font-family:var(--f-head);font-size:26px;font-weight:600;border:1px solid rgba(255,255,255,.08)}
.pad button:active{background:rgba(255,255,255,.28)}
.pad .blank{visibility:hidden}
#lock .forgot{margin-top:28px;color:#ffffff;opacity:.75;text-decoration:underline;font-size:14px}

/* الإعدادات */
.set{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

<body>

<header>
  <div class="row">
    <button class="iconbtn hidden" id="backBtn" aria-label="رجوع">→</button>
    <h1 id="title">الحقوق المالية</h1>
    <button class="iconbtn" id="setBtn" aria-label="الإعدادات">⚙</button>
  </div>
</header>

<main id="app"></main>
<button class="fab" id="fab">+ حق جديد</button>
<div id="print"></div>

<script>
/* ============ التخزين ============ */
var KEY = 'huquq-data-v1';
var db = loadDb();
function loadDb(){
  try{ var d = JSON.parse(localStorage.getItem(KEY)); if(d && d.people && d.entries) return d; }catch(e){}
  return {people:[], entries:[], pin:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('تعذّر الحفظ على هذا الجهاز'); } }
var PREVIEW = !!window.HUQUQ_PREVIEW; // نسخة التجربة على claude.ai: بدون طباعة ولا تنزيل ملفات
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ أدوات ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function round2(n){ return Math.round(n*100)/100; }
function money(n){ return round2(n).toLocaleString('en-US',{maximumFractionDigits:2}) + ' ريال'; }
function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '';
  var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0];
}
function hashPin(p){ var h=5381; p='huquq:'+p; for(var i=0;i<p.length;i++){ h=((h<<5)+h+p.charCodeAt(i))|0; } return 'h'+(h>>>0).toString(36); }
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

/* ============ الحسابات ============ */
function paid(e){ return round2(e.payments.reduce(function(s,p){return s+p.amount;},0)); }
/* e.items = [{id, date, desc, amount}] إضافات على المبلغ الأول (مثل مشتريات متتابعة) */
function itemsSum(e){ return round2((e.items||[]).reduce(function(a,x){ return a+x.amount; },0)); }
function total(e){ return round2(e.amount + itemsSum(e)); }
function remaining(e){ return round2(total(e) - paid(e)); }
/* الأقساط: e.plan = {count, freq:'monthly'|'weekly', start:'YYYY-MM-DD'} — الجدول يُحسب ولا يُخزَّن،
   والدفعات تُوزَّع على الأقساط بالترتيب (الأقدم أولًا) */
function addPeriod(start, i, freq){
  var p = start.split('-').map(Number);
  if(freq==='weekly') return new Date(Date.UTC(p[0],p[1]-1,p[2]+7*i)).toISOString().slice(0,10);
  var m = p[1]-1+i, y = p[0]+Math.floor(m/12); m = ((m%12)+12)%12;
  var last = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m,Math.min(p[2],last))).toISOString().slice(0,10);
}
function addDays(s, n){ var p = s.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10); }
function installments(e){
  if(!e.plan) return null;
  var n = e.plan.count, base = Math.floor(total(e)/n*100)/100, left = paid(e), list = [];
  for(var i=0;i<n;i++){
    var amt = i===n-1 ? round2(total(e) - base*(n-1)) : base;
    var cov = round2(Math.min(amt, Math.max(0,left))); left = round2(left-amt);
    list.push({n:i+1, of:n, date:addPeriod(e.plan.start,i,e.plan.freq), amount:amt, paid:cov, rest:round2(amt-cov)});
  }
  return list;
}
function nextInst(e){ var l = installments(e); if(!l) return null; for(var i=0;i<l.length;i++) if(l[i].rest>0) return l[i]; return null; }
/* ============ جدولة سداد ما علي لشخص ============
   p.sched = {mode:'quick'|'custom', freq:'monthly'|'weekly', day:1-31, wday:0-6, start, amount, rows:[{date,amount}], paidAtStart}
   تشمل حقوق «علي له» التي ليست على أقساط خاصة بها. الدفعات المسجلة بعد إنشاء الجدولة تُوزَّع على مواعيدها بالترتيب،
   والسريعة تمتد تلقائيًا إذا زاد المبلغ (إضافات جديدة). */
var WDAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function schedEntries(p){ return entriesOf(p.id).filter(function(e){ return e.type!=='li' && !e.plan; }); }
function hasSched(p){ return !!(p && p.sched); }
function schedOwed(p){ return round2(schedEntries(p).reduce(function(a,e){ return a+Math.max(0,remaining(e)); },0)); }
function schedTarget(p){ return round2(schedEntries(p).reduce(function(a,e){ return a+total(e); },0) - (p.sched.paidAtStart||0)); }
function schedPaid(p){ return Math.max(0, round2(schedEntries(p).reduce(function(a,e){ return a+paid(e); },0) - (p.sched.paidAtStart||0))); }
function ymdUTC(d){ return d.toISOString().slice(0,10); }
function schedDate(sc, i){
  var p = sc.start.split('-').map(Number);
  if(sc.freq==='weekly'){
    var d0 = new Date(Date.UTC(p[0],p[1]-1,p[2])); var shift = (sc.wday - d0.getUTCDay() + 7) % 7;
    return ymdUTC(new Date(Date.UTC(p[0],p[1]-1,p[2]+shift+7*i)));
  }
  var y = p[0], m = p[1]-1;
  if(p[2] > Math.min(sc.day, new Date(Date.UTC(y,m+1,0)).getUTCDate())) m++; // أول موعد في الشهر التالي إن فات اليوم
  m += i; y += Math.floor(m/12); m = ((m%12)+12)%12;
  return ymdUTC(new Date(Date.UTC(y, m, Math.min(sc.day, new Date(Date.UTC(y,m+1,0)).getUTCDate()))));
}
function schedRows(p){
  var sc = p.sched, target = schedTarget(p), rows = [];
  if(target <= 0) return [];
  if(sc.mode==='custom'){
    rows = sc.rows.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).map(function(r){ return {date:r.date, amount:r.amount}; });
  } else {
    var acc = 0;
    for(var i=0; acc < target-0.004 && i<600; i++){
      var amt = round2(Math.min(sc.amount, target-acc)); rows.push({date:schedDate(sc,i), amount:amt}); acc = round2(acc+amt);
    }
  }
  var left = schedPaid(p);
  return rows.map(function(r, i){
    var cov = round2(Math.min(r.amount, Math.max(0,left))); left = round2(left-r.amount);
    return {n:i+1, of:rows.length, date:r.date, amount:r.amount, paid:cov, rest:round2(r.amount-cov)};
  });
}
function schedNext(p){ var l = schedRows(p); for(var i=0;i<l.length;i++) if(l[i].rest>0) return l[i]; return null; }
function schedDue(p){
  var nx = schedNext(p); if(!nx) return 0;
  var lim = nx.date < today() ? today() : nx.date;
  return round2(schedRows(p).filter(function(x){ return x.date<=lim; }).reduce(function(a,x){ return a+x.rest; },0));
}
function schedLate(p){ var nx = hasSched(p) ? schedNext(p) : null; return !!nx && nx.date < today(); }
function schedRule(p){
  var sc = p.sched;
  if(sc.mode==='custom') return 'جدول محدد: '+countTxt(sc.rows.length,'موعد واحد','موعدان','مواعيد','موعدًا');
  return money(sc.amount)+' '+(sc.freq==='weekly' ? 'كل يوم '+WDAYS[sc.wday] : 'يوم '+sc.day+' من كل شهر');
}
/* يوزّع مبلغًا على حقوق الجدولة، الأقدم أولًا */
function paySched(p, amount, date, note){
  var left = round2(amount);
  schedEntries(p).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); }).forEach(function(e){
    var r = remaining(e); if(left<=0 || r<=0) return;
    var x = round2(Math.min(r, left)); e.payments.push({id:uid(), amount:x, date:date, note:note||'سداد حسب الجدولة'}); left = round2(left-x);
  });
}
function dueOf(e){ if(remaining(e)<=0) return ''; if(e.type!=='li' && !e.plan && hasSched(personById(e.personId))) return ''; if(e.plan){ var x = nextInst(e); return x ? x.date : ''; } return e.due || ''; }
function isLate(e){ var d = dueOf(e); return !!d && d < today(); }
/* المبلغ المطلوب الآن: للأقساط = المتأخر مع القسط القادم، وإلا المتبقي كله */
function dueAmount(e){
  if(!e.plan) return remaining(e);
  var nx = nextInst(e); if(!nx) return 0;
  var lim = nx.date < today() ? today() : nx.date;
  return round2(installments(e).filter(function(x){ return x.date<=lim; }).reduce(function(a,x){ return a+x.rest; },0));
}
function daysUntil(s){ return Math.round((new Date(s+'T00:00:00Z') - new Date(today()+'T00:00:00Z'))/86400000); }
/* العدد مع المعدود بالعربية: 1 واحد، 2 مثنى، 3-10 جمع، 11+ مفرد منصوب */
function countTxt(n, one, two, few, many){ var m = n%100; return n===1?one:n===2?two:(m>=3&&m<=10)?n+' '+few:n+' '+many; }
function daysTxt(n){ return countTxt(n,'يوم','يومين','أيام','يومًا'); }
function whenLabel(s){
  var d = daysUntil(s);
  if(d<0) return 'متأخر '+daysTxt(-d);
  if(d===0) return 'اليوم'; if(d===1) return 'غدًا';
  if(d>30){ var mo = Math.round(d/30.44); return mo<12 ? 'بعد '+countTxt(mo,'شهر','شهرين','أشهر','شهرًا') : 'بعد '+(Math.round(mo/12)===1?'سنة':Math.round(mo/12)===2?'سنتين':Math.round(mo/12)+' سنوات'); }
  return 'بعد '+daysTxt(d);
}
function whenCls(s){ var d = daysUntil(s); return d<0?'late':(d===0?'today':''); }
function freqTxt(f){ return f==='weekly'?'كل أسبوع':'كل شهر'; }
function instCount(p){ return countTxt(p.count,'قسط واحد','قسطان','أقساط','قسطًا')+' '+freqTxt(p.freq); }
/* المواعيد خلال عدد من الأيام القادمة (مع المتأخر) */
function upcoming(days){
  var lim = addDays(today(), days), out = [];
  db.entries.forEach(function(e){
    var d = dueOf(e); if(!d || d>lim) return;
    var p = personById(e.personId); if(!p) return;
    var nx = e.plan ? nextInst(e) : null;
    out.push({e:e, p:p, date:d, amount:dueAmount(e), label: nx ? 'القسط '+nx.n+' من '+nx.of : 'موعد السداد'});
  });
  db.people.forEach(function(p){
    if(!hasSched(p)) return;
    var nx = schedNext(p); if(!nx || nx.date>lim) return;
    out.push({e:{type:'alay', reason:'جدولة السداد', plan:true}, p:p, date:nx.date, amount:schedDue(p), label:'جدولة السداد: دفعة '+nx.n+' من '+nx.of});
  });
  return out.sort(function(a,b){ return a.date.localeCompare(b.date); });
}
function personById(id){ return db.people.find(function(p){return p.id===id;}); }
function entriesOf(pid){ return db.entries.filter(function(e){return e.personId===pid;}); }
function personStats(pid){
  var li=0, alay=0, late=0, open=0;
  entriesOf(pid).forEach(function(e){
    var r = remaining(e); if(r<=0) return;
    open++; if(e.type==='li') li+=r; else alay+=r;
    if(isLate(e)) late++;
  });
  if(schedLate(personById(pid))) late++;
  return {li:round2(li), alay:round2(alay), net:round2(li-alay), late:late, open:open};
}
function totals(){
  var li=0, alay=0, late=0;
  db.entries.forEach(function(e){
    var r = remaining(e); if(r<=0) return;
    if(e.type==='li') li+=r; else alay+=r;
    if(isLate(e)) late++;
  });
  db.people.forEach(function(p){ if(schedLate(p)) late++; });
  return {li:round2(li), alay:round2(alay), net:round2(li-alay), late:late};
}

/* ============ الحالة والتنقل ============ */
var state = {view:'home', filter:'all', q:'', personId:null};
function go(view, personId){
  state.view = view; if(personId!==undefined) state.personId = personId;
  render(); window.scrollTo(0,0);
}
$('backBtn').onclick = function(){ go('home'); };
$('setBtn').onclick = function(){ go('settings'); };
$('fab').onclick = function(){ openEntryForm(null, state.view==='person' ? state.personId : null); };

function render(){
  var isHome = state.view==='home';
  $('backBtn').classList.toggle('hidden', isHome);
  $('setBtn').classList.toggle('hidden', !isHome);
  $('fab').classList.toggle('hidden', state.view==='settings');
  if(state.view==='person' && !personById(state.personId)) state.view='home';
  if(state.view==='home') renderHome();
  else if(state.view==='person') renderPerson();
  else renderSettings();
}

/* ============ الرئيسية ============ */
function renderHome(){
  $('title').textContent = 'الحقوق المالية';
  var t = totals();
  var html = '<div class="sum">'+
    '<div class="box"><div class="lbl">لي عند الناس</div><div class="val g">'+money(t.li)+'</div></div>'+
    '<div class="box"><div class="lbl">علي للناس</div><div class="val r">'+money(t.alay)+'</div></div>'+
    '<div class="box net"><div class="lbl">الصافي</div><div class="val '+(t.net>=0?'g':'r')+'">'+
      (t.net===0?'متعادل':(t.net>0?'لك ':'عليك ')+money(Math.abs(t.net)))+'</div></div>'+
  '</div>';
  if(!owner().name && db.entries.length) html += '<button class="sched-cta" id="ownerCta"><i>✎</i><span><b>أضف اسمك وتوقيعك</b><br>ليظهرا في رسائل الواتساب وكشوف الحساب التي ترسلها.</span></button>';
  if(t.late) html += '<div class="alert">⚠ يوجد '+t.late+' '+(t.late===1?'حق متأخر':'حقوق متأخرة')+' عن موعد السداد</div>';
  var up = upcoming(14);
  if(up.length){
    html += '<div class="up"><h4>القادم خلال أسبوعين</h4>'+up.slice(0,6).map(function(x){
      return '<button class="uprow" data-p="'+x.p.id+'"><span class="when '+whenCls(x.date)+'">'+whenLabel(x.date)+'</span>'+
        '<div class="info"><div class="name">'+esc(x.p.name)+'</div><div class="meta">'+esc(x.label)+' · '+fmtDate(x.date)+(x.e.reason?' · '+esc(x.e.reason):'')+'</div></div>'+
        '<div class="amt '+(x.e.type==='li'?'g':'r')+'">'+money(x.amount)+'<div class="meta">'+(x.e.type==='li'?'تستلمه':'تدفعه')+'</div></div></button>';
    }).join('')+(up.length>6?'<div class="more">و'+countTxt(up.length-6,'موعد آخر','موعدان آخران','مواعيد أخرى','موعدًا آخر')+'، تجدها في صفحات الأشخاص</div>':'')+'</div>';
  }

  html += '<input class="search" id="q" placeholder="ابحث باسم الشخص..." value="'+esc(state.q)+'">';
  var chips = [['all','الكل'],['li','لي عندهم'],['alay','علي لهم'],['late','متأخر'],['done','مسدَّد بالكامل']];
  html += '<div class="chips">'+chips.map(function(c){
    return '<button class="chip'+(state.filter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>';
  }).join('')+'</div>';

  var list = db.people.map(function(p){ return {p:p, s:personStats(p.id), n:entriesOf(p.id).length}; });
  list = list.filter(function(x){
    if(state.q && x.p.name.indexOf(state.q.trim())<0) return false;
    if(state.filter==='li') return x.s.li>0;
    if(state.filter==='alay') return x.s.alay>0;
    if(state.filter==='late') return x.s.late>0;
    if(state.filter==='done') return x.s.open===0 && x.n>0;
    return true;
  });
  list.sort(function(a,b){ return (b.s.late-a.s.late) || (Math.abs(b.s.net)-Math.abs(a.s.net)); });
  if(list.length){
    var sLi=0, sAl=0, sLate=0;
    list.forEach(function(x){
      sLi+=x.s.li; sAl+=x.s.alay;
      entriesOf(x.p.id).forEach(function(e){ if(isLate(e)) sLate += dueAmount(e); });
    });
    var cnt = countTxt(list.length,'شخص واحد','شخصان','أشخاص','شخصًا');
    var sumHtml;
    if(state.filter==='li') sumHtml = '<span>مجموع ما لي عندهم ('+cnt+')</span><b class="g">'+money(sLi)+'</b>';
    else if(state.filter==='alay') sumHtml = '<span>مجموع ما علي لهم ('+cnt+')</span><b class="r">'+money(sAl)+'</b>';
    else if(state.filter==='late') sumHtml = '<span>مجموع المتأخر ('+cnt+')</span><b class="r">'+money(sLate)+'</b>';
    else if(state.filter==='done') sumHtml = '<span>مسدَّد بالكامل</span><b>'+cnt+'</b>';
    else sumHtml = '<span>مجموع القائمة ('+cnt+')</span><span>لي <b class="g">'+money(sLi)+'</b> · علي <b class="r">'+money(sAl)+'</b></span>';
    html += '<div class="listsum">'+sumHtml+'</div>';
  }

  if(!db.people.length){
    html += '<div class="empty">لا توجد حقوق مسجلة بعد.<br>اضغط زر <b>«+ حق جديد»</b> في أسفل الشاشة لإضافة أول حق.</div>';
  } else if(!list.length){
    html += '<div class="empty">لا توجد نتائج.</div>';
  } else {
    html += list.map(function(x){
      var s=x.s, bal;
      if(s.open===0) bal='<span style="color:var(--muted)">مسدَّد</span>';
      else if(s.net>0) bal='<span class="g">'+money(s.net)+'<small>لي عنده</small></span>';
      else if(s.net<0) bal='<span class="r">'+money(-s.net)+'<small>علي له</small></span>';
      else bal='<span>متعادل</span>';
      var meta = s.open ? (s.open+' '+(s.open===1?'حق مفتوح':'حقوق مفتوحة')) : 'لا يوجد مفتوح';
      if(s.late) meta += ' · <span class="tag-late">'+s.late+' متأخر</span>';
      return '<button class="person" data-p="'+x.p.id+'"><div class="avatar">'+esc(x.p.name.trim().charAt(0))+'</div>'+
        '<div class="info"><div class="name">'+esc(x.p.name)+'</div><div class="meta">'+meta+'</div></div>'+
        '<div class="bal">'+bal+'</div></button>';
    }).join('');
  }
  $('app').innerHTML = html;

  var q = $('q');
  q.oninput = function(){ state.q = q.value; var pos=q.selectionStart; renderHome(); var nq=$('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
  document.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ state.filter=b.dataset.f; renderHome(); }; });
  document.querySelectorAll('.person,.uprow').forEach(function(b){ b.onclick=function(){ go('person', b.dataset.p); }; });
  if($('ownerCta')) $('ownerCta').onclick = function(){ go('settings'); };
}

/* ============ صفحة الشخص ============ */
function renderPerson(){
  var p = personById(state.personId), s = personStats(p.id);
  $('title').textContent = p.name;
  var netTxt, netCls;
  if(s.open===0){ netTxt='كل الحقوق مسدَّدة'; netCls='background:var(--soft);color:var(--muted)'; }
  else if(s.net>0){ netTxt='الصافي: لي عنده '+money(s.net); netCls='background:var(--green-bg);color:var(--green)'; }

function waPhone(ph){
  var d = String(ph||'').replace(/[^\d]/g,'');
  if(!d) return '';
  if(d.indexOf('00')===0) d=d.slice(2);
  if(d.indexOf('05')===0 && d.length===10) d='966'+d.slice(1);
  else if(d.indexOf('5')===0 && d.length===9) d='966'+d;
  return d;
}

function calItems(e){
  var p = personById(e.personId), who = (e.type==='li'?'استلام من ':'دفع إلى ')+p.name;
  if(e.plan){
    return installments(e).filter(function(x){return x.rest>0;}).map(function(x){
      return {date:x.date, n:x.n, title:who+' — قسط '+x.n+' من '+x.of+': '+money(x.rest)};
    });
  }
  var d = dueOf(e); return d ? [{date:d, n:0, title:who+' — '+money(remaining(e))}] : [];
}
function ymd(s){ return s.split('-').join(''); }
function googleCalUrl(e){
  var it = calItems(e); if(!it.length) return '';
  var p = personById(e.personId), first = it[0];
  var title = e.plan ? (e.type==='li'?'استلام قسط من ':'دفع قسط إلى ')+p.name+': '+money(installments(e)[0].amount) : first.title;
  var u = 'https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(title)+
    '&dates='+ymd(first.date)+'/'+ymd(addDays(first.date,1))+
    '&details='+encodeURIComponent('من تطبيق الحقوق المالية'+(e.reason?'\nالسبب: '+e.reason:''));
  if(e.plan && it.length>1) u += '&recur='+encodeURIComponent('RRULE:FREQ='+(e.plan.freq==='weekly'?'WEEKLY':'MONTHLY')+';COUNT='+it.length);
  return u;
}
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c;}); }
function icsText(e){
  var it = calItems(e), now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//huquq//ar','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  it.forEach(function(x){
    var t = icsEsc(x.title);
    L.push('BEGIN:VEVENT','UID:'+e.id+'-'+x.n+'@huquq','DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+ymd(x.date),'DTEND;VALUE=DATE:'+ymd(addDays(x.date,1)),
      'SUMMARY:'+t,'DESCRIPTION:'+icsEsc('الحقوق المالية'+(e.reason?' - '+e.reason:'')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t,'TRIGGER:-PT15H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t,'TRIGGER:PT9H','END:VALARM',
      'END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function openCalendar(id){
  var e = db.entries.find(function(x){return x.id===id;}), it = calItems(e);
  if(!it.length) return;
  sheet('<h3>أضف المواعيد إلى تقويم جوالك</h3>'+
    '<p class="msg">سيُضاف '+countTxt(it.length,'موعد واحد','موعدان','مواعيد','موعدًا')+' (من '+fmtDate(it[0].date)+(it.length>1?' إلى '+fmtDate(it[it.length-1].date):'')+'). تقويم جوالك هو الذي ينبّهك في وقتها حتى لو كان التطبيق مغلقًا.</p>'+
    '<div class="calbtns">'+
      '<a class="btn pri" target="_blank" rel="noopener" href="'+esc(googleCalUrl(e))+'">جوال أندرويد (تقويم Google)</a>'+

      '<button class="btn sec" id="calNo">إغلاق</button></div>'+
    '<div class="hint" style="margin-top:10px;line-height:1.8">أندرويد: تفتح صفحة الموعد، اضغط «حفظ» أو «Save» في أعلاها.'+(PREVIEW?'':'<br>آيفون: يظهر ملف التقويم، اضغط «إضافة الكل» أو «Add All».')+'</div>');
  $('calNo').onclick = closeSheet;

/* ============ النسخ الاحتياطي إلى Google Drive ============
   - مفتاح الربط GOOGLE_CLIENT_ID من مشروع Google Cloud (نوع Web، والمصدر المسموح https://naser2777.github.io)
   - الصلاحية drive.file: التطبيق يرى فقط الملفات التي أنشأها هو، داخل مجلد DRIVE_FOLDER
   - النسخ التلقائي عند فتح التطبيق إذا مرّت 12 ساعة على آخر نسخة (لا يعمل التطبيق وهو مغلق)
   - ملف واحد DRIVE_FILE يُحدَّث في كل مرة (Drive يحفظ إصداراته السابقة 30 يومًا) */
var GOOGLE_CLIENT_ID = '';
var DRIVE_FOLDER = 'الحقوق المالية - نسخ احتياطية';
var DRIVE_FILE = 'الحقوق المالية - نسخة احتياطية.json';
var DRIVE_EVERY = 12*3600*1000, BK_KEY = 'huquq-drive';
function bkGet(){ try{ return JSON.parse(localStorage.getItem(BK_KEY)) || {}; }catch(e){ return {}; } }
function bkSet(o){ try{ localStorage.setItem(BK_KEY, JSON.stringify(o)); }catch(e){} }
function bkPatch(p){ var b = bkGet(); for(var k in p) b[k] = p[k]; bkSet(b); return b; }
var gisLoading = null;
function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gisLoading) return gisLoading;
  gisLoading = new Promise(function(res, rej){
    var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = res; sc.onerror = function(){ gisLoading = null; rej(new Error('لا يوجد اتصال بالإنترنت')); };
    document.head.appendChild(sc);
  });
  return gisLoading;
}
function getToken(interactive, chooseAccount){
  var b = bkGet();
  if(!chooseAccount && b.token && b.tokenExp > Date.now()) return Promise.resolve(b.token);
  return loadGis().then(function(){ return new Promise(function(res, rej){
    var c = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
      prompt: chooseAccount ? 'select_account' : '',
      login_hint: chooseAccount ? undefined : (b.email || undefined),
      callback: function(r){
        if(r.error) return rej(new Error(r.error));
        bkPatch({token:r.access_token, tokenExp:Date.now()+(Number(r.expires_in||3600)-120)*1000});
        if(!chooseAccount) return res(r.access_token);
        // حساب جديد: نقرأ الإيميل، ونبدأ مجلدًا جديدًا في حسابه
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+r.access_token}})
          .then(function(x){ return x.ok ? x.json() : {}; }).catch(function(){ return {}; })
          .then(function(u){ bkPatch({email:u.email||'', folderId:null, fileId:null}); res(r.access_token); });
      },
      error_callback: function(err){ rej(new Error(err && err.type==='popup_closed' ? 'أُغلقت نافذة Google قبل الإكمال' : 'لم تُفتح نافذة Google')); }
    });
    c.requestAccessToken();
  }); });
}
function gfetch(token, url, opt){
  opt = opt || {}; opt.headers = Object.assign({Authorization:'Bearer '+token}, opt.headers || {});
  return fetch(url, opt).then(function(r){
    if(r.status===401) bkPatch({token:null});
    if(!r.ok){ var er = new Error('رد Google: '+r.status); er.status = r.status; throw er; }
    return r;
  });
}
var GD = 'https://www.googleapis.com/drive/v3/files';
function ensureFolder(token){
  var b = bkGet(); if(b.folderId) return Promise.resolve(b.folderId);
  var q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+DRIVE_FOLDER+"' and trashed=false");
  return gfetch(token, GD+'?q='+q+'&fields=files(id)').then(function(r){ return r.json(); }).then(function(j){
    if(j.files && j.files.length) return j.files[0].id;
    return gfetch(token, GD+'?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder'})})
      .then(function(r){ return r.json(); }).then(function(j2){ return j2.id; });
  }).then(function(id){ bkPatch({folderId:id}); return id; });
}
function stampNow(){
  var d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16).replace('T',' ').replace(':','-');
}
function backupJson(){ return JSON.stringify({app:'huquq', version:3, exported:new Date().toISOString(), owner:db.owner||null, people:db.people, entries:db.entries}); }
function listBackups(token, fid){
  var q = encodeURIComponent("'"+fid+"' in parents and trashed=false");
  return gfetch(token, GD+'?q='+q+'&orderBy=createdTime desc&pageSize=100&fields=files(id,name,createdTime)')
    .then(function(r){ return r.json(); }).then(function(j){ return j.files || []; });
}
function createBackupFile(token, fid){
  var bd = 'huquq'+Date.now();
  var body = '--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+
    JSON.stringify({name:DRIVE_FILE, parents:[fid], mimeType:'application/json'})+
    '\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+backupJson()+'\r\n--'+bd+'--';
  return gfetch(token, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+bd}, body:body})
    .then(function(r){ return r.json(); }).then(function(j){ bkPatch({fileId:j.id}); });
}
function updateBackupFile(token, id){
  return gfetch(token, 'https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media&fields=id',
    {method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body:backupJson()});
}
/* يحدّث الملف نفسه إن وُجد، وإلا يبحث عنه بالاسم في المجلد، وإلا ينشئه */
function uploadBackup(token, fid){
  var b = bkGet();
  if(b.fileId) return updateBackupFile(token, b.fileId);
  var q = encodeURIComponent("'"+fid+"' in parents and name='"+DRIVE_FILE+"' and trashed=false");
  return gfetch(token, GD+'?q='+q+'&fields=files(id)').then(function(r){ return r.json(); }).then(function(j){
    if(j.files && j.files.length){ bkPatch({fileId:j.files[0].id}); return updateBackupFile(token, j.files[0].id); }
    return createBackupFile(token, fid);
  });
}
function driveBackup(interactive, chooseAccount){
  return getToken(interactive, chooseAccount).then(function(token){
    function go2(retry){
      return ensureFolder(token).then(function(fid){
        return uploadBackup(token, fid);
      }).catch(function(e){
        if(retry && e.status===404){ bkPatch({folderId:null, fileId:null}); return go2(false); } // الملف أو المجلد حُذف من Drive
        throw e;
      });
    }
    return go2(true);
  }).then(function(){ bkPatch({connected:true, lastAt:Date.now(), lastErr:''}); })
    .catch(function(e){ bkPatch({lastErr:String(e.message||e)}); throw e; });
}
function autoBackup(){
  var b = bkGet();
  if(PREVIEW || !GOOGLE_CLIENT_ID || !b.connected) return;
  if(b.lastAt && Date.now()-b.lastAt < DRIVE_EVERY) return;
  if(navigator.onLine===false) return;
  driveBackup(false).then(function(){ toast('تم النسخ الاحتياطي إلى Google Drive ✓'); })
    .catch(function(){ toast('تعذّر النسخ إلى Drive، افتح الإعدادات للتفاصيل'); });
}
function fmtTime(ms){
  var d = new Date(ms), p = function(n){ return (n<10?'0':'')+n; };
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' الساعة '+p(d.getHours())+':'+p(d.getMinutes());
}
function driveSection(){

  if(!GOOGLE_CLIENT_ID) return '<div class="set"><h4>Google Drive</h4><p>الربط بـ Google Drive سيعمل بعد إضافة مفتاح Google إلى التطبيق.</p></div>';

      '<div class="actions"><button class="btn pri" id="drvNow">انسخ الآن</button><button class="btn sec" id="drvRestore">استرجاع من Drive</button>'+

  } else {
    h += '<p>اربط التطبيق بحسابك في Google Drive لتُرفع نسخة من بياناتك تلقائيًا عند فتح التطبيق مرتين في اليوم. التطبيق لا يرى في Drive إلا الملفات التي ينشئها هو.</p>'+
      '<p>عند الضغط على الزر تظهر قائمة حساباتك في Google، فاختر الإيميل الذي تريد أن تُحفظ النسخ في Drive الخاص به.</p>'+
      '<button class="btn pri" id="drvOn">اختيار الحساب وربط Google Drive</button>';
  }
  return h + '</div>';
}

  };
  if($('drvOff')) $('drvOff').onclick = function(){
    ask('سيتوقف النسخ التلقائي إلى Drive. النسخ الموجودة في Drive تبقى كما هي.', 'إلغاء الربط', function(){
      var b = bkGet();
      try{ if(b.token && window.google && google.accounts) google.accounts.oauth2.revoke(b.token, function(){}); }catch(e){}
      bkSet({}); renderSettings(); toast('أُلغي الربط');
    });
  };
}

/* ============ الإعدادات ============ */
function renderSettings(){
  $('title').textContent = 'الإعدادات';
  $('app').innerHTML =
    '<div class="set" id="ownerSet"><h4>بياناتك</h4><p>تظهر في رسائل الواتساب وكشوف الحساب التي ترسلها.</p>'+
      '<div class="field"><label>اسمك</label><input id="oName" value="'+esc(owner().name||'')+'" placeholder="مثال: نصر بن محمد"></div>'+
      '<div class="field"><label>جوالك (اختياري)</label><input id="oPhone" type="tel" dir="ltr" value="'+esc(owner().phone||'')+'" placeholder="05xxxxxxxx"></div>'+
      '<div class="field"><label>التوقيع في آخر الرسالة (اختياري)</label><textarea id="oSign" placeholder="مثال: أخوك المحب\nنصر بن محمد">'+esc(owner().sign||'')+'</textarea>'+
        '<div class="hint">إن تركته فارغًا يُكتب اسمك فقط.</div></div>'+
      '<div class="hint" id="oPrev" style="white-space:pre-line;background:var(--soft2);border-radius:10px;padding:10px;margin-bottom:12px"></div>'+
      '<button class="btn pri" id="oSave">حفظ بياناتي</button></div>'+
    '<div class="set"><h4>تغيير الرمز السري</h4><p>الرمز المكون من 4 أرقام الذي يُطلب عند فتح التطبيق.</p><button class="btn sec" id="chPin">تغيير الرمز</button></div>'+
    '<div class="set"><h4>قفل التطبيق الآن</h4><p>يُقفل التطبيق تلقائيًا أيضًا إذا خرجت منه أكثر من دقيقة.</p><button class="btn sec" id="lockNow">قفل الآن</button></div>'+
    driveSection()+
    (PREVIEW ? '<div class="set"><h4>نسخة احتياطية</h4><p>هذه نسخة تجربة. حفظ النسخة الاحتياطية وكشف الحساب للطباعة يعملان في نسخة الجوال المثبَّتة.</p></div>' :
    '<div class="set"><h4>نسخة احتياطية</h4><p>بياناتك محفوظة على هذا الجوال فقط. احفظ نسخة احتياطية من وقت لآخر حتى لا تضيع إذا تغيّر الجوال أو حُذف التطبيق.</p>'+
      '<div class="actions"><button class="btn pri" id="exp">حفظ نسخة احتياطية</button><button class="btn sec" id="imp">استرجاع نسخة</button></div>'+
      '<input type="file" id="impFile" accept=".json,application/json" class="hidden"></div>')+
    '<div class="set"><h4>حذف كل البيانات</h4><p>يحذف كل الأشخاص والحقوق والدفعات من هذا الجوال نهائيًا.</p><button class="btn danger" id="wipe">حذف كل البيانات</button></div>'+
    '<div class="hint" style="text-align:center;margin-top:16px">الحقوق المالية — الإصدار 7</div>';
  function ownerPrev(){
    var tmp = {name:$('oName').value.trim(), phone:$('oPhone').value.trim(), sign:$('oSign').value.trim()}, keep = db.owner;
    db.owner = tmp; var sg = signLines(); db.owner = keep;
    $('oPrev').textContent = 'هكذا تنتهي رسائلك:\n\nوجزاك الله خيرًا.'+(sg.length?'\n\n'+sg.join('\n'):'');
  }
  ['oName','oPhone','oSign'].forEach(function(id){ $(id).oninput = ownerPrev; }); ownerPrev();
  $('oSave').onclick = function(){
    db.owner = {name:$('oName').value.trim(), phone:$('oPhone').value.trim(), sign:$('oSign').value.trim()};
    save(); toast('تم حفظ بياناتك');
  };
  $('chPin').onclick = function(){ showLock('change'); };
  $('lockNow').onclick = function(){ showLock('enter'); };
  bindDrive();
  if(!PREVIEW){
    $('exp').onclick = exportData;
    $('imp').onclick = function(){ $('impFile').click(); };
    $('impFile').onchange = importData;
  }
  $('wipe').onclick = function(){
    ask('سيتم حذف كل الأشخاص والحقوق والدفعات نهائيًا من هذا الجهاز، ولا يمكن التراجع.\nهل أنت متأكد؟', 'نعم، احذف كل البيانات', function(){
      db.people=[]; db.entries=[]; save(); go('home'); toast('تم حذف كل البيانات');
    });
  };
}
function exportData(){
  var data = JSON.stringify({app:'huquq', version:1, exported:new Date().toISOString(), owner:db.owner||null, people:db.people, entries:db.entries}, null, 1);
  var blob = new Blob([data], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'الحقوق-المالية-نسخة-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('تم حفظ النسخة الاحتياطية');
}
function importData(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(d.app!=='huquq' || !Array.isArray(d.people) || !Array.isArray(d.entries)) throw 0;
      ask('سيتم استبدال البيانات الحالية بما في النسخة ('+d.people.length+' شخص، '+d.entries.length+' حق). متابعة؟', 'نعم، استرجع', function(){
        db.people=d.people; db.entries=d.entries; if(d.owner) db.owner=d.owner; save(); go('home'); toast('تم استرجاع النسخة');
      }, true);
    }catch(e){ info('هذا الملف ليس نسخة احتياطية صحيحة من تطبيق الحقوق المالية.'); }
  };
  rd.readAsText(f); ev.target.value='';
}

/* ============ القفل بالرمز ============ */
var lockMode='enter', pinBuf='', firstPin='';
function buildPad(){
  var keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('pad').innerHTML = keys.map(function(k){ return '<button class="'+(k?'':'blank')+'" data-k="'+k+'">'+k+'</button>'; }).join('');
  $('pad').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ pressKey(b.dataset.k); }; });
}
function showLock(mode){
  lockMode = mode; pinBuf=''; firstPin='';
  $('lock').classList.remove('hidden');
  $('forgotBtn').classList.toggle('hidden', mode!=='enter');
  setLockMsg();
  drawDots();
}
function setLockMsg(){
  var t = {enter:['الحقوق المالية','أدخل الرمز السري'], setup:['مرحبًا بك','اختر رمزًا سريًا من 4 أرقام لحماية بياناتك'],
    confirm:['تأكيد الرمز','أدخل الرمز نفسه مرة أخرى'], change:['تغيير الرمز','أدخل الرمز الحالي'],
    newpin:['الرمز الجديد','أدخل الرمز الجديد من 4 أرقام']}[lockMode];
  $('lockTitle').textContent=t[0]; $('lockMsg').textContent=t[1];
}
function drawDots(){ $('dots').querySelectorAll('span').forEach(function(s,i){ s.classList.toggle('f', i<pinBuf.length); }); }
function shake(msg){
  var d=$('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  $('lockMsg').textContent = msg; pinBuf=''; drawDots();
}
function pressKey(k){
  if(!k) return;
  if(k==='⌫'){ pinBuf=pinBuf.slice(0,-1); drawDots(); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=k; drawDots();
  if(pinBuf.length<4) return;
  var pin=pinBuf;
  setTimeout(function(){
    if(lockMode==='enter'){
      if(hashPin(pin)===db.pin) unlock(); else shake('الرمز غير صحيح، حاول مرة أخرى');
    } else if(lockMode==='change'){
      if(hashPin(pin)===db.pin){ lockMode='newpin'; pinBuf=''; setLockMsg(); drawDots(); } else shake('الرمز الحالي غير صحيح');
    } else if(lockMode==='setup' || lockMode==='newpin'){
      firstPin=pin; lockMode='confirm'; pinBuf=''; setLockMsg(); drawDots();
    } else if(lockMode==='confirm'){
      if(pin===firstPin){ var wasNew=!db.pin; db.pin=hashPin(pin); save(); unlock(); toast(wasNew?'تم حفظ الرمز السري':'تم تغيير الرمز'); }
      else { lockMode = db.pin ? 'newpin' : 'setup'; firstPin=''; shake('الرمزان غير متطابقين، ابدأ من جديد'); }
    }
  }, 120);
}
function unlock(){ $('lock').classList.add('hidden'); pinBuf=''; render(); remindOnOpen(); autoBackup(); }
$('forgotBtn').onclick = function(){
  ask('لا يمكن استرجاع الرمز السري لأنه محفوظ على جهازك فقط.\n\nالحل الوحيد: مسح كل البيانات والرمز والبدء من جديد، ثم استرجاع آخر نسخة احتياطية حفظتها (إن وُجدت).\n\nستُحذف كل الحقوق المسجلة. متابعة؟', 'امسح كل شيء وابدأ من جديد', function(){
    db = {people:[], entries:[], pin:null}; save(); showLock('setup');
  });
};
var hiddenAt=0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden) hiddenAt=Date.now();
  else if(db.pin && hiddenAt && Date.now()-hiddenAt>60000 && $('lock').classList.contains('hidden')){ closeSheet(); showLock('enter'); }
});

/* ============ البدء ============ */
buildPad();
render();
showLock(db.pin ? 'enter' : 'setup');
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
